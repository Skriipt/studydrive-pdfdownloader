<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Studydrive PDF Downloader</title>
  <desc id="desc">Save the preview already loaded in your browser. A document sheet with an illustration of the extension’s Download PDF button and file size. This is an interface illustration, not a screenshot of Studydrive.</desc>
  <rect width="1200" height="420" rx="24" fill="#edf7f4"/>

  <g id="document" transform="translate(876 40)">
    <path d="M0 16A16 16 0 0 1 16 0H138L196 58V292A16 16 0 0 1 180 308H16A16 16 0 0 1 0 292Z" fill="#fff" stroke="#c9e2da" stroke-width="2"/>
    <path d="M138 0V42A16 16 0 0 0 154 58H196" fill="#dbede6"/>
    <path d="M34 92H154M34 116H154M34 140H112" fill="none" stroke="#c9e2da" stroke-width="8" stroke-linecap="round"/>
    <path d="M98 169V217M78 199L98 219L118 199M70 242H126" fill="none" stroke="#008374" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="project-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="73" fill="#397167" font-size="22" font-weight="600" letter-spacing="2">BROWSER EXTENSION</text>
    <text x="56" y="171" fill="#163e35" font-size="78" font-weight="700" letter-spacing="-2">Studydrive</text>
    <text x="56" y="263" fill="#008374" font-size="82" font-weight="700" letter-spacing="-3">PDF Downloader</text>
    <text x="60" y="327" fill="#397167" font-size="28">Your loaded preview. Saved as a PDF.</text>
  </g>

  <g id="download-control" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="817" y="280" width="320" height="72" rx="12" fill="#008374"/>
    <text x="977" y="326" fill="#fff" font-size="32" font-weight="700" text-anchor="middle">Download PDF</text>
    <text x="817" y="388" fill="#397167" font-size="24">2.4 MB</text>
  </g>
</svg>
